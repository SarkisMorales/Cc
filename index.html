<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Multicalc</title>
  <meta name="description" content="Varias calculadoras en una: cambiá entre ellas sin perder las cuentas.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Multicalc">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="style-ios">
  <script>
    // Aplica el estilo guardado antes de pintar (evita el parpadeo al abrir)
    try {
      var d = JSON.parse(localStorage.getItem('multicalc:v1'));
      if (d && d.style === 'win') {
        var t = d.winTheme || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.body.className = 'style-win' + (dark ? ' dark' : '');
      }
    } catch (e) {}
  </script>
  <div id="app">
    <!-- Barra de calculadoras -->
    <header class="topbar">
      <div class="tabs" id="tabs" role="tablist" aria-label="Calculadoras"></div>
      <button class="icon-btn" id="btn-add" aria-label="Nueva calculadora">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btn-menu" aria-label="Ajustes">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
    </header>

    <!-- Pantalla -->
    <section class="screen" id="screen">
      <button class="hist-btn" id="btn-history" aria-label="Historial">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <span class="mem-indicator" id="mem-ind" aria-label="Hay un valor en memoria">M</span>
      <div class="readout" id="readout">
        <div class="expr" id="expr"></div>
        <div class="value-wrap" id="value-wrap"><div class="value" id="value" aria-live="polite">0</div></div>
      </div>
    </section>

    <!-- Teclado estilo iPhone -->
    <section class="keypad keypad-ios" aria-label="Teclado">
      <button class="k fn" data-key="ac" id="ios-ac">AC</button>
      <button class="k fn" data-key="neg" aria-label="Más/menos"><svg viewBox="0 0 24 24" class="pm"><path d="M7 4v8M3 8h8M13 18h8M18 4 7 20" /></svg></button>
      <button class="k fn" data-key="%">%</button>
      <button class="k op" data-key="÷" aria-label="Dividir">÷</button>
      <button class="k" data-key="7">7</button>
      <button class="k" data-key="8">8</button>
      <button class="k" data-key="9">9</button>
      <button class="k op" data-key="×" aria-label="Multiplicar">×</button>
      <button class="k" data-key="4">4</button>
      <button class="k" data-key="5">5</button>
      <button class="k" data-key="6">6</button>
      <button class="k op" data-key="−" aria-label="Restar">−</button>
      <button class="k" data-key="1">1</button>
      <button class="k" data-key="2">2</button>
      <button class="k" data-key="3">3</button>
      <button class="k op" data-key="+" aria-label="Sumar">+</button>
      <button class="k" data-action="overview" aria-label="Ver calculadoras">
        <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      </button>
      <button class="k" data-key="0">0</button>
      <button class="k dec" data-key=".">,</button>
      <button class="k op" data-key="=" aria-label="Igual">=</button>
    </section>

    <!-- Teclado estilo Windows -->
    <section class="keypad-win-wrap" aria-label="Teclado">
      <div class="memrow">
        <button class="m" data-key="mc" aria-label="Borrar memoria">MC</button>
        <button class="m" data-key="mr" aria-label="Recuperar memoria">MR</button>
        <button class="m" data-key="m+" aria-label="Sumar a memoria">M+</button>
        <button class="m" data-key="m-" aria-label="Restar a memoria">M−</button>
        <button class="m" data-key="ms" aria-label="Guardar en memoria">MS</button>
      </div>
      <div class="keypad keypad-win">
        <button class="k fn" data-key="%">%</button>
        <button class="k fn" data-key="ce">CE</button>
        <button class="k fn" data-key="ac">C</button>
        <button class="k fn" data-key="back" aria-label="Borrar"><svg viewBox="0 0 24 24" class="ico"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button>
        <button class="k fn" data-key="inv" aria-label="Uno sobre x"><span>1/<i>x</i></span></button>
        <button class="k fn" data-key="sq" aria-label="Cuadrado"><span><i>x</i>²</span></button>
        <button class="k fn" data-key="sqrt" aria-label="Raíz cuadrada"><span>²√<i>x</i></span></button>
        <button class="k fn" data-key="÷" aria-label="Dividir">÷</button>
        <button class="k" data-key="7">7</button>
        <button class="k" data-key="8">8</button>
        <button class="k" data-key="9">9</button>
        <button class="k fn" data-key="×" aria-label="Multiplicar">×</button>
        <button class="k" data-key="4">4</button>
        <button class="k" data-key="5">5</button>
        <button class="k" data-key="6">6</button>
        <button class="k fn" data-key="−" aria-label="Restar">−</button>
        <button class="k" data-key="1">1</button>
        <button class="k" data-key="2">2</button>
        <button class="k" data-key="3">3</button>
        <button class="k fn" data-key="+" aria-label="Sumar">+</button>
        <button class="k" data-key="neg" aria-label="Más/menos"><span>+/−</span></button>
        <button class="k" data-key="0">0</button>
        <button class="k dec" data-key=".">,</button>
        <button class="k eq" data-key="=" aria-label="Igual">=</button>
      </div>
    </section>
  </div>

  <!-- Menú al mantener apretado el número -->
  <div class="popover" id="popover" hidden>
    <button data-pop="copy">Copiar</button>
    <button data-pop="paste">Pegar</button>
    <button data-pop="send">Enviar a…</button>
  </div>

  <!-- Hoja inferior genérica -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-drag" id="sheet-drag">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="sheet-close" id="sheet-close">Listo</button>
        </div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-btn" hidden></button></div>

  <label class="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1" id="haptic-input"></label>

  <script type="module" src="app.js"></script>
</body>
</html>
